# Install on the Ubuntu host as /etc/nginx/sites-available/signal-rate.com.
# Certificate files are provisioned outside Git. Cloudflare must use Full (strict).
geo $realip_remote_addr $signalrate_cloudflare_trusted {
    default 0;
    include /etc/nginx/snippets/cloudflare-trusted-geo.conf;
}

map "$signalrate_cloudflare_trusted:$http_cf_ray" $signalrate_cf_ray {
    default "";
    "~^1:([0-9a-fA-F]{16,32}(?:-[A-Za-z]{3})?)$" $1;
}

map "$signalrate_cloudflare_trusted:$http_cf_ipcountry" $signalrate_cf_country {
    default "";
    "~^1:([A-Z0-9]{2})$" $1;
}

map $uri $signalrate_locale {
    default en;
    ~^/(ar|ja|pt-br|de|es|hi|fr|ko|id)(?:/|$) $1;
}

map $uri $signalrate_route_class {
    default unknown;
    ~*^/(?:[^/]+/)?(?:\.env|\.git|\.aws|\.azure|wp-admin|wp-login\.php|phpmyadmin|vendor/|actuator|server\.key|backup\.sql|dump\.sql|database\.sql) scanner_probe;
    ~*^/(?:fetch|proxy|preview|download|read|screenshot|webhook)(?:/|$) scanner_probe;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)?/?$ homepage;
    ~^/_next/static/ static_asset;
    ~^/_next/image static_asset;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)/network/ network_tool;
    ~^/network/ network_tool;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)/developer-tools/ developer_tool;
    ~^/developer-tools/ developer_tool;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)/calculators/ calculator;
    ~^/calculators/ calculator;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)/tools/ tool_page;
    ~^/tools/ tool_page;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?guides(?:/|$) guide;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?countries(?:/|$) country;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?(?:calling-codes|mcc|carriers|data)(?:/|$) telecom;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?mobile-plans(?:/|$) mobile_plan;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?errors(?:/|$) error_kb;
    ~^/(?:ar|ja|pt-br|de|es|hi|fr|ko|id)/search$ search;
    ~^/search$ search;
    ~^/api/v1(?:/|$) api;
    /api api;
    /sitemap.xml sitemap;
    /robots.txt robots;
    ~^/(?:ar/|ja/|pt-br/|de/|es/|hi/|fr/|ko/|id/)?(?:about|contact|privacy|terms|methodology|data-policy)$ legal;
    ~^/(?:ads\.txt|app-ads\.txt|sellers\.json)$ ads;
    ~^/(?:favicon\.ico|apple-touch-icon\.png)$ static_asset;
}

map $uri $signalrate_upstream_kind {
    default frontend;
    ~^/api/v1(?:/|$) backend_api;
    ~^/_next/static/ static;
    /health nginx;
}

map "$upstream_addr:$signalrate_upstream_kind" $signalrate_effective_upstream_kind {
    default $signalrate_upstream_kind;
    ~^: nginx;
}

map $request_time $signalrate_request_time_ms {
    default "";
    "~^([0-9]+)\.([0-9]{3})$" $1$2;
}

map $upstream_connect_time $signalrate_upstream_connect_time_ms {
    default "";
    "~^([0-9]+)\.([0-9]{3})$" $1$2;
}

map $upstream_header_time $signalrate_upstream_header_time_ms {
    default "";
    "~^([0-9]+)\.([0-9]{3})$" $1$2;
}

map $upstream_response_time $signalrate_upstream_response_time_ms {
    default "";
    "~^([0-9]+)\.([0-9]{3})$" $1$2;
}

map $arg__rsc $signalrate_is_rsc {
    default true;
    "" false;
}

map $http_content_type $signalrate_request_content_type {
    default "";
    ~^([A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+) $1;
}

map $http_user_agent $signalrate_user_agent_family {
    default other;
    "" unknown;
    ~*Googlebot googlebot_claim;
    ~*bingbot bingbot_claim;
    ~*(Applebot|DuckDuckBot|YandexBot|Baiduspider) search_crawler_claim;
    ~*(Claude|GPTBot|ChatGPT|OAI-SearchBot|Perplexity|GrokBot|Amazonbot|Bytespider|facebookexternalhit|LinkedInBot) other_crawler;
    ~*(HeadlessChrome|Chrome-Lighthouse) headless_browser;
    ~*Codex codex_automation;
    ~*node node_script;
    ~*curl curl;
    ~*(python-requests|Go-http-client|okhttp|masscan|nmap|sqlmap|nikto) security_tool;
    ~*(Edg|Edge)/ edge;
    ~*Firefox/ firefox;
    ~*(Chrome|CriOS)/ chrome;
    ~*(Safari|Mobile)/ safari;
}

map $http_user_agent $signalrate_device_class {
    default unknown;
    ~*(Mobile|Android|iPhone|iPad) mobile;
    ~*(Windows|Macintosh|X11|Linux) desktop;
}

map "$signalrate_route_class:$signalrate_user_agent_family" $signalrate_traffic_class {
    default unknown;
    ~^scanner_probe: security_scanner;
    ~:googlebot_claim$ googlebot_claim_unverified;
    ~:bingbot_claim$ bingbot_claim_unverified;
    ~:search_crawler_claim$ known_search_crawler_claim_unverified;
    ~:other_crawler$ other_crawler;
    ~:headless_browser$ headless_browser;
    ~:codex_automation$ codex_automation;
    ~:node_script$ node_script;
    ~:curl$ curl;
    ~:security_tool$ security_scanner;
    ~:(edge|firefox|chrome|safari)$ human_browser_heuristic;
}

log_format signalrate_public '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent '
                             'rt=$request_time us="$upstream_status" urt="$upstream_response_time" '
                             '"$http_user_agent"';
log_format signalrate_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"sr_$request_id",'
    '"method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"uri_path":"$uri",'
    '"protocol":"$server_protocol",'
    '"status":"$status",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_kind":"$signalrate_effective_upstream_kind",'
    '"request_time_ms":"$signalrate_request_time_ms",'
    '"upstream_connect_time_ms":"$signalrate_upstream_connect_time_ms",'
    '"upstream_header_time_ms":"$signalrate_upstream_header_time_ms",'
    '"upstream_response_time_ms":"$signalrate_upstream_response_time_ms",'
    '"request_bytes":"$request_length",'
    '"response_bytes":"$bytes_sent",'
    '"cf_ray":"$signalrate_cf_ray",'
    '"cf_country":"$signalrate_cf_country",'
    '"cf_cache_status":"$sent_http_cf_cache_status",'
    '"client_id":null,'
    '"referer":null,'
    '"user_agent":"$http_user_agent",'
    '"user_agent_family":"$signalrate_user_agent_family",'
    '"device_class":"$signalrate_device_class",'
    '"traffic_class":"$signalrate_traffic_class",'
    '"route_class":"$signalrate_route_class",'
    '"locale":"$signalrate_locale",'
    '"is_rsc":"$signalrate_is_rsc",'
    '"content_type":"$signalrate_request_content_type",'
    '"cache_control":"$sent_http_cache_control",'
    '"response_content_type":"$sent_http_content_type"'
'}';
log_format signalrate_security escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"sr_$request_id",'
    '"client_ip":"$remote_addr"'
'}';

server {
    listen 80;
    listen [::]:80;
    server_name signal-rate.com www.signal-rate.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/signalrate-access.json.log signalrate_json;
    access_log /var/log/nginx/signalrate-security.json.log signalrate_security;
    add_header X-Request-ID "sr_$request_id" always;
    return 301 https://signal-rate.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.signal-rate.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/signalrate-access.json.log signalrate_json;
    access_log /var/log/nginx/signalrate-security.json.log signalrate_security;
    add_header X-Request-ID "sr_$request_id" always;

    ssl_certificate /etc/ssl/signalrate/origin.pem;
    ssl_certificate_key /etc/ssl/signalrate/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://signal-rate.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signal-rate.com;
    access_log /var/log/nginx/signalrate-access.log signalrate_public;
    access_log /var/log/nginx/signalrate-access.json.log signalrate_json;
    access_log /var/log/nginx/signalrate-security.json.log signalrate_security;

    ssl_certificate /etc/ssl/signalrate/origin.pem;
    ssl_certificate_key /etc/ssl/signalrate/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SignalRateTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Request-ID "sr_$request_id" always;

    client_max_body_size 1m;

    # The sitemap contains public canonical URLs only. A short TTL avoids
    # regenerating it for every crawler request while allowing fresh releases
    # and verified telecom imports to appear promptly. Other HTML and API
    # responses intentionally retain their application-provided cache policy.
    location = /sitemap.xml {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID "sr_$request_id";
        proxy_hide_header X-Request-ID;
        proxy_hide_header Cache-Control;
        expires 1h;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID "sr_$request_id";
        proxy_hide_header X-Request-ID;
        proxy_pass http://127.0.0.1:8080;
    }
}
