# Install on the Ubuntu host as /etc/nginx/sites-available/signal-rate.com.
# Certificate files are provisioned outside Git. Cloudflare must use Full (strict).
log_format signalrate_public '$time_iso8601 "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name signal-rate.com www.signal-rate.com;
    access_log off;
    return 301 https://signal-rate.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.signal-rate.com;
    access_log off;

    ssl_certificate /etc/ssl/signalrate/origin.pem;
    ssl_certificate_key /etc/ssl/signalrate/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://signal-rate.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signal-rate.com;
    access_log /var/log/nginx/signalrate-access.log signalrate_public;

    ssl_certificate /etc/ssl/signalrate/origin.pem;
    ssl_certificate_key /etc/ssl/signalrate/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SignalRateTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 1m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8080;
    }
}
