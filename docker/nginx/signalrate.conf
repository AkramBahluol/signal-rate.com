limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
upstream signalrate_frontend { server frontend:3000; keepalive 16; }
upstream signalrate_backend { server backend:9000; keepalive 16; }
server { listen 80; server_name www.signal-rate.com; return 301 https://signal-rate.com$request_uri; }
server {
  listen 80;
  server_name signal-rate.com;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /api/ { limit_req zone=api burst=10 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param REQUEST_URI $request_uri; fastcgi_pass signalrate_backend; }
  location / { proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://signalrate_frontend; }
}
