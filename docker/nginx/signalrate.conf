map $remote_addr $signalrate_internal_frontend { default ""; 172.30.0.2 "frontend"; }
limit_req_zone $http_x_forwarded_for zone=api:10m rate=30r/m;
upstream signalrate_frontend { server frontend:3000; keepalive 16; }
upstream signalrate_backend { server backend:9000; keepalive 16; }
log_format signalrate '$time_iso8601 "$request" $status $body_bytes_sent "$http_user_agent"';
server_tokens off;
server {
  listen 80 default_server;
  server_name signal-rate.com;
  access_log /var/log/nginx/access.log signalrate;
  client_max_body_size 1m;
  limit_req_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location = /api { proxy_set_header Host $host; proxy_set_header X-Real-IP $http_x_forwarded_for; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_pass http://signalrate_frontend; }
  location /api/ { limit_req zone=api burst=10 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param REQUEST_URI $request_uri; fastcgi_param HTTP_HOST $host; fastcgi_param HTTP_X_FORWARDED_HOST $host; fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for; fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto; fastcgi_param HTTP_X_SIGNALRATE_INTERNAL $signalrate_internal_frontend; fastcgi_pass signalrate_backend; }
  location / { proxy_set_header Host $host; proxy_set_header X-Real-IP $http_x_forwarded_for; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_pass http://signalrate_frontend; }
}
server { listen 80; server_name www.signal-rate.com; access_log off; return 301 https://signal-rate.com$request_uri; }
