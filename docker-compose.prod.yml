x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: signalrate/frontend-production:${SIGNALRATE_RELEASE:-latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_ADSENSE_ENABLED: ${NEXT_PUBLIC_ADSENSE_ENABLED:-false}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
    environment:
      ADS_TXT_LINE: ${ADS_TXT_LINE:-}
      API_INTERNAL_URL: http://nginx
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging
    expose: ["3000"]
    networks:
      edge:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    image: signalrate/backend-production:${SIGNALRATE_RELEASE:-latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.production
    restart: unless-stopped
    env_file: ${SIGNALRATE_ENV_FILE:-.env.production}
    init: true
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging
    expose: ["9000"]
    volumes:
      - backend_storage:/var/www/storage
      - backend_cache:/var/www/bootstrap/cache
    networks:
      edge:
        ipv4_address: 172.30.0.3
      data:
        ipv4_address: 172.30.1.2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    read_only: true
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/signalrate.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    networks:
      edge:
        ipv4_address: 172.30.0.4
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Host: signal-rate.com' -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 1024m
    cpus: 0.75
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: ["postgres_prod:/var/lib/postgresql/data"]
    networks:
      data:
        ipv4_address: 172.30.1.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 384m
    cpus: 0.25
    logging: *default-logging
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","allkeys-lru"]
    volumes: ["redis_prod:/data"]
    networks:
      data:
        ipv4_address: 172.30.1.4
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_prod:
  redis_prod:
  backend_storage:
  backend_cache:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/28
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/28
