services:

  frontend:
    image: node:22-alpine
    container_name: signalrate-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "test -x node_modules/.bin/next || npm install; npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: signalrate-backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    command: sh -c "test -f vendor/autoload.php || composer install --no-interaction --prefer-dist; cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: signalrate
      DB_USERNAME: signalrate
      DB_PASSWORD: signalrate_local_password

      REDIS_HOST: redis
      REDIS_PORT: 6379
      NETWORK_TRUSTED_PROXIES: ${NETWORK_TRUSTED_PROXIES:-}
      NETWORK_PROVIDER_TIMEOUT: ${NETWORK_PROVIDER_TIMEOUT:-5}
      NETWORK_SOCKET_TIMEOUT: ${NETWORK_SOCKET_TIMEOUT:-3}
      DIRECTORY_RATE_LIMIT_PER_MINUTE: ${DIRECTORY_RATE_LIMIT_PER_MINUTE:-2000}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: signalrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signalrate
      POSTGRES_USER: signalrate
      POSTGRES_PASSWORD: signalrate_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalrate -d signalrate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: signalrate-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_vendor:
  postgres_data:
  redis_data:
  frontend_node_modules:
